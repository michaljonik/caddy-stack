version: 2
updates:
  # Caddy itself (both FROM lines). Plugin versions in the Dockerfile are bumped by hand.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  # all action bumps in one pull request (one build instead of one per action)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
